# 示例：加入已有 Nginx 的 http {} 内，替换域名、端口后再启用。
# TLS 证书及 HTTPS 监听由平台现有配置负责；此文件不创建公网入口。
# 游戏应设置 PUBLIC_URL 为实际对外根地址。
server {
    listen 80;
    server_name chroma.example.com;

    # SSE URL 带身份 token，避免访问日志记录完整查询串。
    location = /api/events {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_cache off;
    }
}
